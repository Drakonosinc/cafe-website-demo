  <rect x="66" y="346" width="108" height="30" rx="6" fill="#231915"/>
  <circle cx="84" cy="361" r="7" fill="#E8C687"/>
  <text x="84" y="365" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#231915">M</text>
  <text x="128" y="365" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#FAF6F0">Est. Centro</text>

  <!-- Pin de Cafetería Demo en esquina Calle Ejemplo 123 -->
  <circle cx="316" cy="186" r="24" fill="#9E3E20" opacity="0.22"/>
  <path d="M316 112c-20 0-36 16-36 36 0 26 36 62 36 62s36-36 36-62c0-20-16-36-36-36Z" fill="#9E3E20" stroke="#231915" stroke-width="3"/>
  <circle cx="316" cy="146" r="14" fill="#FAF6F0"/>
  <path d="M308 144h16v6a8 8 0 0 1-16 0v-6Z" fill="#231915"/>

