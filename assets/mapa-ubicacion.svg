  <text x="316" y="96" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#E8DDD1">Calle Ejemplo 123 · Barrio Centro</text>

  <!-- Rosa de los vientos minimalista -->
  <g transform="translate(576 56)">
    <circle cx="0" cy="0" r="20" fill="#FFFDF9" stroke="#231915" stroke-width="2"/>
    <path d="M0-13l4 13-4-3-4 3Z" fill="#9E3E20"/>
    <text x="0" y="13" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#231915">N</text>
