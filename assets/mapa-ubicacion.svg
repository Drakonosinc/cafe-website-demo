  <circle cx="554" cy="242" r="22" fill="#456D52"/>
  <circle cx="486" cy="254" r="14" fill="#456D52"/>
  <text x="532" y="210" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#244A31">Plaza del Barrio</text>

  <rect x="28" y="328" width="160" height="66" rx="10" fill="#E8DDD1"/>
  <rect x="228" y="328" width="184" height="66" rx="10" fill="#E8DDD1"/>
  <rect x="452" y="328" width="160" height="66" rx="10" fill="#E8DDD1"/>

  <!-- Calles principales (crema claro) -->
  <rect x="0" y="142" width="640" height="38" fill="#FFFDF9"/>
  <rect x="0" y="290" width="640" height="38" fill="#FFFDF9"/>
  <rect x="188" y="0" width="40" height="420" fill="#FFFDF9"/>
  <rect x="412" y="0" width="40" height="420" fill="#FFFDF9"/>

  <!-- Líneas de eje de calles -->
  <line x1="0" y1="161" x2="640" y2="161" stroke="#D9C6B4" stroke-width="1.5" stroke-dasharray="8 8"/>
  <line x1="0" y1="309" x2="640" y2="309" stroke="#D9C6B4" stroke-width="1.5" stroke-dasharray="8 8"/>
  <line x1="208" y1="0" x2="208" y2="420" stroke="#D9C6B4" stroke-width="1.5" stroke-dasharray="8 8"/>
  <line x1="432" y1="0" x2="432" y2="420" stroke="#D9C6B4" stroke-width="1.5" stroke-dasharray="8 8"/>

  <!-- Nombres de calles -->
  <text x="108" y="166" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#4E3B31">Calle Ejemplo</text>
  <text x="532" y="166" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#4E3B31">Calle Ejemplo</text>
  <text x="320" y="314" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#4E3B31">Av. Principal</text>

  <text x="208" y="242" text-anchor="middle" transform="rotate(-90 208 242)" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#4E3B31">Pasaje del Grano</text>
  <text x="432" y="96" text-anchor="middle" transform="rotate(-90 432 96)" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#4E3B31">Bulevar Central</text>

