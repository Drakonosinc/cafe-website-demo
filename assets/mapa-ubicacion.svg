  <rect x="228" y="28" width="184" height="114" rx="10" fill="#E8DDD1"/>
  <rect x="452" y="28" width="160" height="114" rx="10" fill="#E8DDD1"/>

  <rect x="28" y="180" width="160" height="110" rx="10" fill="#E8DDD1"/>
  <rect x="228" y="180" width="184" height="110" rx="10" fill="#E8DDD1"/>
  <!-- Plaza del barrio -->
  <rect x="452" y="180" width="160" height="110" rx="10" fill="#D7E5D9" stroke="#7C9C84" stroke-width="2"/>
