    <path d="M-7 0c4 2 10-2 14 0" fill="none" stroke="#C9AB90" stroke-width="1.4" stroke-linecap="round"/>
  </g>

  <!-- Ramita botánica decorativa -->
  <path d="M56 446c26-10 48-26 68-48" fill="none" stroke="#456D52" stroke-width="2.6" stroke-linecap="round"/>
  <ellipse cx="76" cy="432" rx="10" ry="5" transform="rotate(-25 76 432)" fill="#7C9C84" stroke="#244A31" stroke-width="1.4"/>
  <ellipse cx="100" cy="416" rx="9" ry="4.5" transform="rotate(-35 100 416)" fill="#7C9C84" stroke="#244A31" stroke-width="1.4"/>
