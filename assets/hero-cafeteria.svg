<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" width="640" height="520">
  <defs>
    <linearGradient id="heroWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F6EDE2"/>
      <stop offset="100%" stop-color="#EADCCF"/>
    </linearGradient>
    <linearGradient id="sunBeam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFDF9" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#F2EAE0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="carafeCoffee" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7B462D"/>
      <stop offset="100%" stop-color="#2D1B14"/>
    </linearGradient>
  </defs>

  <!-- Fondo cálido arquitectónico -->
  <rect width="640" height="520" rx="28" fill="url(#heroWall)"/>

  <!-- Arco de ventana con luz natural -->
  <path d="M100 372V176a148 148 0 0 1 296 0v196Z" fill="#FFFDF9"/>
  <path d="M114 372V180a134 134 0 0 1 268 0v192Z" fill="#F7EFE4"/>
