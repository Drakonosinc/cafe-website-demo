  <!-- Taza protagonista con latte art sobre plato -->
  <ellipse cx="348" cy="414" rx="70" ry="15" fill="#FFFDF9" stroke="#231915" stroke-width="2.8"/>
  <ellipse cx="348" cy="412" rx="46" ry="9" fill="#E8DDD1"/>
  <path d="M294 342h108v30c0 24-24 38-54 38s-54-14-54-38v-30Z" fill="#9E3E20" stroke="#231915" stroke-width="3"/>
  <path d="M402 350h14a14 14 0 0 1 0 28h-15" fill="none" stroke="#231915" stroke-width="3"/>
  <path d="M402 353h12a11 11 0 0 1 0 22h-13" fill="none" stroke="#9E3E20" stroke-width="4.5"/>
  <ellipse cx="348" cy="342" rx="54" ry="13" fill="#FFFDF9" stroke="#231915" stroke-width="3"/>
  <ellipse cx="348" cy="343" rx="46" ry="9.5" fill="#9D6443"/>
