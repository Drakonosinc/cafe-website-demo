  <line x1="248" y1="46" x2="248" y2="372" stroke="#D9C6B4" stroke-width="3"/>
  <line x1="114" y1="210" x2="382" y2="210" stroke="#D9C6B4" stroke-width="3"/>

  <!-- Planta decorativa en estante (debajo del cuadro, sin solapar) -->
  <path d="M454 246h98" stroke="#8C593D" stroke-width="6" stroke-linecap="round"/>
  <path d="M478 243l5-34h36l5 34Z" fill="#9E3E20"/>
  <path d="M501 209c-14-18-28-20-34-10 12 4 22 10 34 10Zm0 0c4-24 18-32 28-24-8 10-18 18-28 24Zm0 0c-4-26-2-40 6-46 6 12 4 28-6 46Z" fill="#456D52"/>

  <!-- Cuadro en pared derecha -->
  <rect x="444" y="70" width="96" height="78" rx="8" fill="#FFFDF9" stroke="#CBB6A1" stroke-width="2.5"/>
  <rect x="456" y="81" width="72" height="56" rx="4" fill="#F6EDE2"/>
  <circle cx="480" cy="100" r="10" fill="#E8C687"/>
  <path d="M456 137c16-20 30-22 44-10 10-12 20-10 28 2v8h-72Z" fill="#9E3E20" opacity="0.88"/>
  <path d="M456 137c14-12 28-10 42 0" fill="#456D52"/>

  <!-- Mesa de madera artesanal -->
  <rect y="368" width="640" height="152" fill="#D8BEA5"/>
  <rect y="368" width="640" height="14" fill="#B99272"/>
  <path d="M0 404h640M0 448h640" stroke="#C9AB90" stroke-width="1.5" opacity="0.65"/>

  <!-- Sombra proyectada sobre la mesa -->
  <ellipse cx="176" cy="404" rx="82" ry="14" fill="#A98566" opacity="0.4"/>
  <ellipse cx="348" cy="422" rx="74" ry="13" fill="#A98566" opacity="0.4"/>
  <ellipse cx="502" cy="410" rx="72" ry="13" fill="#A98566" opacity="0.4"/>

  <!-- Jarra Chemex / Pour-over -->
  <path d="M126 398l32-98c4-12 2-20-6-32l-18-36h84l-18 36c-8 12-10 20-6 32l32 98a16 16 0 0 1-15 21H141a16 16 0 0 1-15-21Z" fill="#FFFDF9" fill-opacity="0.86" stroke="#231915" stroke-width="3" stroke-linejoin="round"/>
  <path d="M134 388l17-52h50l17 52a12 12 0 0 1-11 16h-62a12 12 0 0 1-11-16Z" fill="url(#carafeCoffee)"/>
  <!-- Collar de madera -->
  <path d="M150 286h52l-4 28h-44Z" fill="#9E5B3B" stroke="#231915" stroke-width="2.5"/>
