  <g transform="translate(274 446) rotate(24)">
    <ellipse cx="0" cy="0" rx="9" ry="6.5" fill="#4E3124" stroke="#231915" stroke-width="1.6"/>
    <path d="M-7 0c4 2 10-2 14 0" fill="none" stroke="#C9AB90" stroke-width="1.4" stroke-linecap="round"/>
