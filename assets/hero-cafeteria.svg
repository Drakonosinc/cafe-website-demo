  <path d="M332 343c6-5 12-5 16 0 4-5 10-5 16 0-5 5-11 6-16 3-5 3-11 2-16-3Z" fill="#FAF6F0"/>
  <circle cx="348" cy="341" r="3" fill="#FAF6F0"/>

