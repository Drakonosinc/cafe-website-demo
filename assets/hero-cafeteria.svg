  <!-- Plato con medialuna dorada -->
  <ellipse cx="502" cy="402" rx="66" ry="14" fill="#FAF6F0" stroke="#231915" stroke-width="2.6"/>
  <path d="M462 397c10-22 26-30 40-30s30 8 40 30c-14 6-26 2-40 2s-26 4-40-2Z" fill="#C98842" stroke="#231915" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M482 371c4 10 4 20 0 27M502 367v32M522 371c-4 10-4 20 0 27" fill="none" stroke="#8C5320" stroke-width="2" stroke-linecap="round"/>

  <!-- Granos de café tostados sueltos -->
  <g transform="translate(245 436) rotate(-18)">
    <ellipse cx="0" cy="0" rx="10" ry="7" fill="#3B251B" stroke="#231915" stroke-width="1.6"/>
    <path d="M-8 0c4 2 12-2 16 0" fill="none" stroke="#C9AB90" stroke-width="1.4" stroke-linecap="round"/>
